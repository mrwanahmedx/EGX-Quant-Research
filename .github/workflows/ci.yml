name: CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package
        run: python -m pip install -e .

      - name: Compile source
        run: python -m compileall src tests

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Validate JSON files
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for path in list(Path("config").rglob("*.json")) + list(Path("schemas").rglob("*.json")):
              json.loads(path.read_text(encoding="utf-8"))
              print("valid", path)
          PY

      - name: Check raw data is not committed
        run: |
          python - <<'PY'
          from pathlib import Path
          forbidden = [Path("data/raw"), Path("data/interim"), Path("data/processed")]
          tracked_like = []
          for root in forbidden:
              if root.exists():
                  for p in root.rglob("*"):
                      if p.is_file():
                          tracked_like.append(str(p))
          if tracked_like:
              raise SystemExit("Research data files must not be committed: " + ", ".join(tracked_like))
          print("no raw/interim/processed data committed")
          PY
