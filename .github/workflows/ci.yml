name: CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package
        run: python -m pip install -e .

      - name: Compile source
        run: python -m compileall src tests

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Enforce public-data boundary
        run: python scripts/check_public_boundary.py

      - name: Validate committed JSON metadata
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          roots = [Path("config"), Path("schemas"), Path("evidence"), Path("examples")]
          for root in roots:
              if not root.exists():
                  continue
              for path in root.rglob("*.json"):
                  json.loads(path.read_text(encoding="utf-8"))
                  print("valid", path)
          PY

      - name: Check raw data is not committed
        run: |
          python - <<'PY'
          from pathlib import Path
          forbidden = [Path("data/raw"), Path("data/interim"), Path("data/processed")]
          tracked_like = []
          for root in forbidden:
              if root.exists():
                  for p in root.rglob("*"):
                      if p.is_file():
                          tracked_like.append(str(p))
          if tracked_like:
              raise SystemExit("Research data files must not be committed: " + ", ".join(tracked_like))
          print("no raw/interim/processed data committed")
          PY

      - name: Assert point-in-time index reconstruction remains blocked
        shell: bash
        run: |
          set +e
          python scripts/validate_index_reviews.py > /tmp/index-review-status.json
          code=$?
          set -e
          cat /tmp/index-review-status.json
          if [ "$code" -ne 2 ]; then
            echo "Expected current dated index reviews to remain blocked until identities are resolved; got exit $code"
            exit 1
          fi

      - name: Assert guarded baseline runner remains blocked
        shell: bash
        run: |
          cat > /tmp/baseline-observations.json <<'JSON'
          [
            {"session_date":"2025-01-02","canonical_security_id":"EGX:A","score":1.0,"target_return":0.01},
            {"session_date":"2025-01-02","canonical_security_id":"EGX:B","score":0.0,"target_return":0.00}
          ]
          JSON
          set +e
          python scripts/run_baseline_research.py             --observations /tmp/baseline-observations.json             --top-k 1 > /tmp/baseline-status.txt
          code=$?
          set -e
          cat /tmp/baseline-status.txt
          if [ "$code" -ne 2 ]; then
            echo "Expected real baseline runner to stay blocked until readiness passes; got exit $code"
            exit 1
          fi

      - name: Assert current real-research gate fails closed
        shell: bash
        run: |
          set +e
          python scripts/research_readiness.py --json > /tmp/research-readiness.json
          code=$?
          set -e
          cat /tmp/research-readiness.json
          if [ "$code" -ne 2 ]; then
            echo "Expected the current repository to remain blocked until real evidence is imported; got exit $code"
            exit 1
          fi

      - name: Exercise readiness snapshot writer
        run: |
          python scripts/write_readiness_snapshot.py             --output /tmp/readiness-snapshot.json             --generated-at 2026-09-26T00:00:00Z
          python -m json.tool /tmp/readiness-snapshot.json > /dev/null
