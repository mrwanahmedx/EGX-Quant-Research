[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "egx-quant-research"
version = "0.1.0"
description = "Leakage-aware research infrastructure for EGX quantitative modeling"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Marwan Ahmed"}]
dependencies = []

[project.optional-dependencies]
modeling = [
  "numpy>=1.26",
  "pandas>=2.1",
  "scikit-learn>=1.4",
  "lightgbm>=4.3",
  "xgboost>=2.0",
  "catboost>=1.2"
]

[tool.setuptools.packages.find]
where = ["src"]
